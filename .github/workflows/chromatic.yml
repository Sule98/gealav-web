name: Validate GEALAV

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, types and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check code
        run: npm run lint
      - name: Build production site
        run: npm run build
      - name: Check types
        run: npm run typecheck
